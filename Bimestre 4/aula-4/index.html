<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
        .chart-wrapper{
            display: flex;
            justify-content: center;
            height: 600px;
            overflow: hidden;
        }
    </style>

    </head>
    <body>
        <div class="chart-wrapper">
            <canvas class="chart">

            </canvas>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js" ></script>

        <script>
        const chart = document.querySelector(".chart")

        new Chart(chart , {
            type: "pie",
            data: {
                labels : ["Charmander" , "Squirtle" , "Bulbassauro" , "Pikachu" , "Garchomp"],
                datasets: [{
                    data: [35 , 20 , 25 , 20, 50]
                }]
            }
        })
    </script>
    </body>
